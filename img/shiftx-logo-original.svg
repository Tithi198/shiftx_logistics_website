<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2B4C" />
      <stop offset="100%" stop-color="#0A1526" />
    </linearGradient>
    
    <!-- Filter for soft shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" />

  <!-- Logo Mark Group -->
  <g transform="translate(0, -10)" filter="url(#dropShadow)">
    <!-- Blue Ribbon Segment (Back/Underneath layers simulated via paths) -->
    <path d="M 210,130 L 250,90 L 290,130 L 250,170 Z" fill="url(#blueGrad)" />
    <path d="M 250,170 L 290,210 L 250,250 L 210,210 Z" fill="url(#blueGrad)" />
    
    <!-- Interlocking Gold Ribbon Loops -->
    <path d="M 250,90 C 280,60 330,90 310,130 L 290,130 C 305,105 275,85 250,110 Z" fill="url(#goldGrad)" />
    <path d="M 250,250 C 220,280 170,250 190,210 L 210,210 C 195,235 225,255 250,230 Z" fill="url(#goldGrad)" />
    
    <!-- Arrow heads to indicate movement/logistics -->
    <polygon points="290,130 305,120 300,140" fill="url(#blueGrad)" />
    <polygon points="210,210 195,220 200,200" fill="url(#blueGrad)" />
  </g>

  <!-- Typography Group -->
  <g text-anchor="middle" id="editable-text-layers">
    <!-- SHIFTX Wordmark -->
    <text x="250" y="340" font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" font-weight="900" font-size="52" fill="#1A2B4C" letter-spacing="2">SHIFTX</text>
    
    <!-- Decorative Line -->
    <line x1="120" y1="365" x2="380" y2="365" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
    
    <!-- LOGISTICS Subtext -->
    <text x="252" y="405" font-family="'Montserrat', 'Helvetica Neue', 'Arial', sans-serif" font-weight="500" font-size="24" fill="#1A2B4C" letter-spacing="12">LOGISTICS</text>
  </g>
</svg>
